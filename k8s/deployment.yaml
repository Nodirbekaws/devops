apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: react-app

  template:
    metadata:
      labels:
        app: react-app

    spec:
      containers:
        - name: react-app
          image: 980819806741.dkr.ecr.us-east-1.amazonaws.com/react-devops
          ports:
            - containerPort: 80